name: Compiler le plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Récupérer les fichiers du plugin
        uses: actions/checkout@v4

      - name: Récupérer le SDK BakkesMod
        run: git clone --depth 1 https://github.com/bakkesmodorg/BakkesModSDK.git sdk

      - name: Compiler AimCocoStats.dll
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++20 /EHsc /O2 /MD /LD /utf-8 /I sdk\include /I . AimCocoStats.cpp /link /LIBPATH:sdk\lib pluginsdk.lib /OUT:AimCocoStats.dll
          if errorlevel 1 exit /b 1
          sdk\bakkesmod-patch.exe AimCocoStats.dll

      - name: Mettre la DLL à disposition
        uses: actions/upload-artifact@v4
        with:
          name: AimCocoStats
          path: AimCocoStats.dll
